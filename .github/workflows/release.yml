name: Exe della release

# Quando pubblichi una release su GitHub, compila MicroMonitor.exe e lo allega.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a cui allegare l'exe (es. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compila MicroMonitor.exe
        run: dotnet publish MicroMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Allega l'exe alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" publish/MicroMonitor.exe --clobber
